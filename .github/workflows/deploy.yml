name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_branch:
        description: 'Optional existing PR preview to refresh (pr-N); empty deploys production from main only'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Astro
        run: npm run check
      - name: Build site
        run: npm run build
        env:
          ASTRO_SITE: https://www.dreamcleanmacon.com
          ASTRO_BASE: /
      - name: Prevent preview indexing
        if: github.event_name == 'pull_request' || inputs.preview_branch != ''
        run: node scripts/prepare-preview.mjs
      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site
          path: dist
          retention-days: 7

  deploy:
    needs: build
    # Fork PRs get build checks, but cannot access Cloudflare credentials.
    # Manual runs from other branches must never publish to production.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.preview_branch != '') ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.preview_branch != '' && format('preview-{0}', inputs.preview_branch) || github.event_name == 'pull_request' && format('preview-pr-{0}', github.event.pull_request.number) || 'production' }}
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install deployment tools
        run: npm ci --ignore-scripts
      - name: Download site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site
          path: dist
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add the CLOUDFLARE_API_TOKEN repository Actions secret (Account / Cloudflare Pages / Edit).'
            exit 1
          fi
      - name: Validate manual preview branch
        if: github.event_name == 'workflow_dispatch' && inputs.preview_branch != ''
        env:
          PREVIEW_BRANCH: ${{ inputs.preview_branch }}
        run: |
          if ! [[ "$PREVIEW_BRANCH" =~ ^pr-[0-9]+$ ]]; then
            echo '::error::Manual preview refresh requires a pr-N branch name.'
            exit 1
          fi
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e33f99b627bf3afdbc0311ed464a1e42
          command: pages deploy dist --project-name=dream-clean-macon --branch=${{ inputs.preview_branch || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }} --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record deployment links
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          printf 'Deployment: %s\n\nBranch URL: %s\n' "$DEPLOYMENT_URL" "$ALIAS_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify live SEO responses
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYMENT_MODE: ${{ (github.event_name == 'pull_request' || inputs.preview_branch != '') && 'preview' || 'production' }}
        run: |
          # Allow a short propagation window; fail CI if the deployed responses disagree.
          for attempt in 1 2 3; do
            if node scripts/verify-deployment.mjs "$DEPLOYMENT_URL" "$DEPLOYMENT_MODE"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
