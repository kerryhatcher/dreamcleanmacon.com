<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: 0.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f7e9}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <figure class="r-logo region plate" data-region="logo"><img src="../../../public/images/logo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-nav region chrome" data-region="nav"><!-- Housekeeping Property cleaning About navigation links --></div>
  <div class="r-phone region text" data-region="phone"><!-- Blue phone number (678) 232-8614 --><p style="font-size:var(--r-phone-font);line-height:1.05;margin:0">phone</p></div>
  <div class="r-location region text" data-region="location"><!-- Macon and Middle Georgia location label --><p style="font-size:var(--r-location-font);line-height:1.05;margin:0">location</p></div>
  <div class="r-headline region text" data-region="headline"><!-- A clean home. A calmer day. large serif two-line headline --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-intro region text" data-region="intro"><!-- Housekeeping and move-in move-out cleaning paragraph --><p style="font-size:var(--r-intro-font);line-height:1.05;margin:0">intro</p></div>
  <div class="r-quote region control" data-region="quote"><!-- Forest rectangular Request a quote button: rebuild the control's chrome from the crop (comp-spec.mjs --crop quote); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-interior region plate" data-region="interior"><img src="../../../public/images/tranquil-home.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-caption region text" data-region="caption"><!-- Renewed tranquility room by room caption --><p style="font-size:var(--r-caption-font);line-height:1.05;margin:0">caption</p></div>
  <div class="r-home-link region control" data-region="home-link"><!-- 01 For your home service link: rebuild the control's chrome from the crop (comp-spec.mjs --crop home-link); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-property-link region control" data-region="property-link"><!-- 02 For your property service link: rebuild the control's chrome from the crop (comp-spec.mjs --crop property-link); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-start-link region control" data-region="start-link"><!-- Blue Start your quote link: rebuild the control's chrome from the crop (comp-spec.mjs --crop start-link); its ink box, border, fill, radius, and label size are the comp's --></div>
</main>
</body>
</html>
